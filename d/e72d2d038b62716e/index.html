<title>우리집 워크북 3~5세 — 다운로드</title>
<style>
:root{--paper:#FBF8F3;--card:#fff;--ink:#221F26;--sub:#6E6C76;--line:#E6E2DA;--acc:#3C68B8}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
line-height:1.62}
.wrap{max-width:560px;margin:0 auto;padding:56px 20px}
h1{font-size:28px;margin:0 0 8px;letter-spacing:-.02em}
p.sub{color:var(--sub);margin:0 0 28px}
a.dl{display:block;padding:20px;border-radius:16px;background:var(--acc);color:#fff;
text-decoration:none;font-size:19px;font-weight:700;text-align:center}
a.dl small{display:block;font-weight:500;font-size:13px;opacity:.86;margin-top:5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:18px;margin-top:26px;font-size:14.5px;color:var(--sub)}
.box b{color:var(--ink)}
ul{padding-left:18px;margin:8px 0 0}li{margin:6px 0}
@media(prefers-color-scheme:dark){:root{--paper:#16151A;--card:#1E1D23;--ink:#F1EEE8;
--sub:#A5A2AC;--line:#312F38;--acc:#6C97DE}}
</style></head><body><div class="wrap">
